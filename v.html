<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Kike's Garage · Ubicación en vivo</title>
<script>
  // Link corto de los SMS de la alarma: kikesgarage46gh.github.io/v#CODIGO
  // Lleva a la página de ubicación en vivo con ese código. El código va
  // después del "#", así nunca viaja a ningún servidor: solo lo lee esta
  // página en el teléfono de quien abre el link.
  (function () {
    var t = (location.hash || '').replace(/^#/, '').replace(/[^A-Za-z0-9]/g, '');
    if (t) {
      location.replace('https://kikesgarage46gh.github.io/kikes-garage-legal/viaje-en-vivo.html?token=' +
        encodeURIComponent(t));
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('m').textContent =
          'El link está incompleto. Pedile a quien te lo mandó que lo vuelva a enviar.';
      });
    }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #000; color: #fff; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         text-align: center; padding: 24px; box-sizing: border-box; }
  p { font-size: 16px; line-height: 1.5; max-width: 420px; }
  b { color: #29E629; }
</style>
</head>
<body>
  <p id="m"><b>Kike's Garage</b><br>Abriendo la ubicación en vivo…</p>
</body>
</html>
